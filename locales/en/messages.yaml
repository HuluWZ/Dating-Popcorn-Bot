      prompt: "Please click on the paperclip symbol and upload a picture of the person"
      processing: "Processing image... This may take a few moments."
      upload_required: "Please upload an image by clicking the paperclip symbol. Text messages are not accepted for image search."
      received: "✅ Image received! Searching for matches..."
  
  results:
    found: "Found {count} review(s) matching your search:"
    none_found: "No reviews found matching your search."
    showing: "Showing {showing} of {total} results"
    distance: "📍 {distance:.1f}km away"
    match_score: "🎯 {score:.0%} match"
    searching: "Searching for '{name}'..."
    mock_results: "🔍 Search Results (Demo Data):\n\n1. **Carlos Andreas Rodriguez**\n   *Met through mutual friends. Very kind and trustworthy person.*\n   📍 2km away | 👤 @carlos_reviewer\n\n2. **Maria Elena Gonzalo**\n   *Dated her for 2 weeks. She was constantly lying and manipulative. Stay away!*\n   📍 2km away\n\n3. **Andreas Rodriguez Gonzalo**\n   *Went on 3 dates. He was rude to waiters and only talked about himself. Not recommended.*\n   📍 5km away | 👤 @andreas_r"
    mock_image_results: "🔍 Image Search Results (Demo Data):\n\n1. **Gonzalo Carlos Rodriguez**\n   *Face recognition match. Very social and outgoing personality.*\n   📍 2km away | 🎯 92% match | 👤 @gonzalo_c\n\n2. **Rodriguez Andreas Gonzalo**\n   *Recognized from your photo. Stood me up twice without any explanation. Very unreliable.*\n   📍 3km away | 🎯 95% match\n\n3. **Elena Maria Rodriguez**\n   *Similar facial features detected. Known for being honest and direct.*\n   📍 5km away | 🎯 87% match | 👤 @elena_m"

