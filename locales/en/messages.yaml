# English localization file with hierarchical structure and variables
common:
  # Variables that can be reused across messages
  variables:
    bot_name: "Toxi Ex"
    max_review_length: "2000"
    max_images_per_review: "5"
    search_radius_km: "50"
    support_email: "support@datingpopcorn.com"
  
  # Common UI elements
  buttons:
    write_review: "Write a Review"
    search_reviews: "Search Reviews"
    share_location: "📍 Share Location"
    cancel: "Cancel the review process"
    confirm: "Confirm"
    skip: "Skip"
    skip_optional: "Skip"
    back_to_menu: "Back to Menu"
    more_results: "More Reviews"
  
  # Common validation messages
  validation:
    name_required: "Name is required. Please enter the person's name."
    review_text_required: "Review text is required. Please tell us about this person."
    invalid_location: "Please share your location using the location button."
    text_too_long: "Text cannot be longer than {max_length} characters."
    image_required: "Please upload an image for this action."
  
  # Common status messages
  status:
    error_occurred: "An error occurred. Please try again."
    processing: "Processing..."
    loading: "Loading..."
    success: "Success!"
    failed: "Failed. Please try again."
  prompts:
    skip_hint: "If you don't have this info, tap the Skip button below."

# Bot flow messages
bot:
  welcome:
    message: "Welcome {name}! This is ${bot_name}. Here, you can share reviews about your toxic ex or bad dates, and also warn others about dangerous or violent individuals. \n\nPlease share your location to use this bot. We need your location to show reviews from your area."
    location_request: "Please share your location to continue."
  
  location:
    received: "Thanks! Would you like to search for reviews or write your own?"
    invalid: "Please share your location using the location button.\nTap the paperclip icon.\nChoose Location.\nTap Send My Current Location (or select a place on the map)."
    already_set: "Your location has already been set. Would you like to search for reviews or write your own?"
    required_for_review: "To write a review, we need your location so we know which city it's for. Please share your location."
    required_for_search: "To search for a review, we need your location so we know which city we should search in. Please share your location."
    share_instructions: "Tap the button below to share your location."
  
  main_menu:
    choose_action: "What would you like to do?"
    welcome_back: "Welcome back, {name}! Would you like to search for a review or write one?"

# Review flow messages
review:
  flow:
    enter_name: "Write the full name of the person."
    enter_contact: "Phone number, Instagram handle, or Telegram username (please enter only one)"
    enter_text: "What can you tell us about him/her? (Maximum ${max_review_length} characters)"
    enter_content: "What can you tell us about them? (Maximum ${max_review_length} characters)"
    upload_image: "Do you want to upload a picture of {name}? If yes, click on the paperclip symbol and upload a picture."
    upload_photo: "Do you want to upload a picture of {name}? If yes, click on the paperclip symbol and upload a picture."
    saved: "Thank you! Your review has been saved and will be reviewed by our team."
    image_url: "Image URL"
    validation:
      name_too_short: "Full name must be at least 2 characters long."
      text_too_short: "Review text must be at least 10 characters long."
      content_too_short: "Review text must be at least 10 characters long."
      text_too_long: "Review text cannot exceed ${max_review_length} characters."
      photo_too_large: "Photo is too large. Maximum size is 5MB."
      invalid_photo_format: "Invalid photo format. Please upload JPG or PNG files only."
      photo_required: "Please upload a photo or click Skip."
      too_many_images: "You can upload a maximum of ${max_images_per_review} images."
    errors:
      photo_upload_failed: "Failed to upload photo. Please try again or skip this step."

# Search flow messages
search:
  flow:
    choose_method: "Do you want to search by name or image?"
    by_name:
      button: "🔍 Search By Name (or Phone/Instagram/...)"
      prompt: "Enter his/her name, phone number, Instagram or Telegram."
      placeholder: "Enter phone number or Instagram username..."
    by_image:
      button: "📷 Search By Image"
      prompt: "Please click on the paperclip symbol and upload a picture of the person."
      processing: "Processing image... This may take a few moments."
      upload_required: "Please upload an image by clicking the paperclip symbol. Text messages are not accepted for image search."
      received: "✅ Image received! Searching for matches..."
      multiple_faces_detected: "Detected {count} face(s) in your image. Showing matches for all faces."
      errors:
        no_face_detected: "❌ No face detected in the image. Please upload a clear photo with a visible face."
        face_too_small_or_low_quality: "❌ Face too small or low quality. Please upload a clearer, higher resolution photo."
        invalid_image: "❌ Invalid image format. Please upload a JPG or PNG image."
        image_too_large: "❌ Image is too large. Maximum size is 15MB."
        detection_failed: "❌ Face detection failed. Please try again with a different photo."
        comparison_failed: "❌ Face comparison failed. Please try again."
  
  results:
    found: "Found {count} review(s) matching your search:"
    none_found: "No results found."
    showing: "Showing {showing} of {total} results"
    distance: "📍 {distance:.1f}km away"
    match_score: "🎯 {score:.0%} match"
    searching: "Searching for '{name}'..."

# Commands
commands:
  start: "Start Bot"
  search: "Search Reviews"
  write: "Write Review"
  help: "Help"
  language: "Change Language"

# Error messages
