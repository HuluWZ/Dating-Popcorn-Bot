  general: "An error occurred. Please try again."
  network: "Network error. Please check your connection and try again."
  permission: "You don't have permission to perform this action."
  not_found: "The requested item was not found."
  validation: "Please check your input and try again."
  rate_limit: "You're doing this too often. Please wait a moment and try again."
  location_not_received: "Please try sharing your location again. Tap the paperclip icon.\nChoose Location.\nTap Send My Current Location (or select a place on the map)."
  location_save_failed: "Failed to save your location. Please try again. Tap the paperclip icon.\nChoose Location.\nTap Send My Current Location (or select a place on the map)."
