    mock_image_results: "🔍 Resultados de Búsqueda por Imagen (Datos Demo):\n\n1. **Gonzalo Carlos Rodriguez** 📱 +1-555-0987\n   *Coincidencia de reconocimiento facial. Personalidad muy social y extrovertida.*\n   📍 2.1km de distancia | 🎯 92% coincidencia\n\n2. **Rodriguez Andreas Gonzalo** 📱 +1-555-0321\n   *Reconocido de tu foto. Me dejó plantada dos veces sin explicación. Muy poco confiable.*\n   📍 3.2km de distancia | 🎯 95% coincidencia\n\n3. **Elena Maria Rodriguez** 📱 +1-555-0654\n   *Rasgos faciales similares detectados. Conocida por ser honesta y directa.*\n   📍 4.7km de distancia | 🎯 87% coincidencia"

