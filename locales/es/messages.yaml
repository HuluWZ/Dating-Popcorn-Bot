    title: "Change Language / Cambiar Idioma:"
    english: "English 🇺🇸"
    spanish: "Español 🇪🇸"
  
  welcome:
    message: "¡Bienvenido {name}! Este es ${bot_name}. Por favor comparte tu ubicación para usar este bot. Usamos tu ubicación para mostrar advertencias de otros hombres y mujeres cerca de ti."
    location_request: "Por favor comparte tu ubicación para continuar."
  
  location:
