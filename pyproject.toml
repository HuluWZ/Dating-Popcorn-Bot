[project]
name = "dating-popcorn-bot"
version = "1.0.0"
requires-python = ">=3.11"
# keep in sync with requirements.txt: FastAPI Cloud installs from pyproject.toml when it exists
dependencies = [
    "aiogram==3.2.0",
    "python-dotenv==1.0.0",
    "Pillow==10.0.1",
    "PyYAML==6.0.1",
    "requests==2.31.0",
    "sqlalchemy==2.0.23",
    "geoalchemy2==0.14.2",
    "asyncpg==0.29.0",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    "shapely==2.0.2",
    "pgvector==0.3.6",
    "opencv-python-headless==4.10.0.84",
    "numpy<2.0",
    "fastapi[standard]==0.115.6",
    "boto3==1.34.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "python-multipart>=0.0.9",
]

[tool.fastapi]
entrypoint = "src.api.main:app"
