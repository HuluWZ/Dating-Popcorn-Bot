version: '3.8'

services:
  dating-popcorn-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dating-popcorn-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - dating-popcorn-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dating-popcorn-network:
    driver: bridge
