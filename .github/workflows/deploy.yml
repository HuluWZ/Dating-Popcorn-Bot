name: Deploy Dating Popcorn Bot to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: 305018987391
  ECR_REPOSITORY: dating-popcorn-bot
  ECS_SERVICE: dating-popcorn-bot-service
  ECS_CLUSTER: dating-popcorn-bot-cluster

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-22.04
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Create ECR Repository (if not exists)
      run: |
        aws ecr create-repository --repository-name $ECR_REPOSITORY --region $AWS_REGION || echo "Repository already exists"

    - name: Create CloudWatch Log Group (if not exists)
      run: |
        aws logs create-log-group --log-group-name /ecs/$ECR_REPOSITORY --region $AWS_REGION || echo "Log group already exists"

    - name: Create ECS Cluster (if not exists)
      run: |
        aws ecs create-cluster --cluster-name $ECS_CLUSTER --region $AWS_REGION || echo "Cluster already exists"

    - name: Create Security Group (if not exists)
      run: |
        # Get default VPC
        VPC_ID=$(aws ec2 describe-vpcs --filters "Name=is-default,Values=true" --query "Vpcs[0].VpcId" --output text --region $AWS_REGION)
        
        # Create security group
        SG_ID=$(aws ec2 create-security-group --group-name dating-popcorn-bot-sg --description "Security group for Dating Popcorn Bot" --vpc-id $VPC_ID --region $AWS_REGION --query "GroupId" --output text 2>/dev/null || aws ec2 describe-security-groups --filters "Name=group-name,Values=dating-popcorn-bot-sg" --query "SecurityGroups[0].GroupId" --output text --region $AWS_REGION)
        
        # Allow inbound traffic on port 8000
        aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 8000 --cidr 0.0.0.0/0 --region $AWS_REGION 2>/dev/null || echo "Rule already exists"
        
        echo "SG_ID=$SG_ID" >> $GITHUB_ENV

    - name: Create ECS Task Definition
      run: |
        cat > task-definition.json << EOF
        {
          "family": "$ECS_SERVICE",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "256",
          "memory": "512",
          "executionRoleArn": "arn:aws:iam::$AWS_ACCOUNT_ID:role/ecsTaskExecutionRole",
          "containerDefinitions": [
            {
              "name": "dating-popcorn-bot-container",
              "image": "${{ steps.build-image.outputs.image }}",
              "portMappings": [
                {
                  "containerPort": 8000,
                  "hostPort": 8000,
                  "protocol": "tcp"
                }
              ],
              "environment": [
                {
                  "name": "BOT_TOKEN",
                  "value": "${{ secrets.BOT_TOKEN }}"
                },
                {
                  "name": "LOG_LEVEL",
                  "value": "INFO"
                },
                {
                  "name": "AWS_REGION",
                  "value": "$AWS_REGION"
                }
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/$ECR_REPOSITORY",
                  "awslogs-region": "$AWS_REGION",
                  "awslogs-stream-prefix": "ecs"
                }
              },
              "healthCheck": {
                "command": ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"],
                "interval": 30,
                "timeout": 5,
                "retries": 3,
                "startPeriod": 60
              },
              "essential": true
            }
          ]
        }
        EOF

    - name: Register ECS Task Definition
      run: |
        aws ecs register-task-definition --cli-input-json file://task-definition.json --region $AWS_REGION

    - name: Create or Update ECS Service
      run: |
        # Get default subnet
        SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=default-for-az,Values=true" --query "Subnets[0].SubnetId" --output text --region $AWS_REGION)
        
        # Check if service exists
        if aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION --query "services[0].serviceName" --output text | grep -q "$ECS_SERVICE"; then
          echo "Service exists, updating..."
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition $ECS_SERVICE --region $AWS_REGION
        else
          echo "Creating new service..."
          aws ecs create-service \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --task-definition $ECS_SERVICE \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
            --region $AWS_REGION
        fi

    - name: Wait for service to be stable
      run: |
        aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION

    - name: Verify deployment
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "📊 Your bot is now running on AWS ECS Fargate"
        echo "💰 Estimated monthly cost: $15-25"
        echo "🔗 Monitor: https://console.aws.amazon.com/ecs/"
        echo "📝 Logs: https://console.aws.amazon.com/cloudwatch/home?region=$AWS_REGION#logsV2:log-groups/log-group/$2Fecs$2F$ECR_REPOSITORY"