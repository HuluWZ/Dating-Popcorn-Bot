name: Deploy Dating Popcorn Bot to EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-22.04
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Debug: Check secret format
        echo "Checking EC2_SSH_KEY secret format..."
        echo "Secret length: ${EC2_SSH_KEY}"
        echo "First 50 chars: ${EC2_SSH_KEY:0:50}"
        echo "Last 50 chars: ${EC2_SSH_KEY: -50}"
        
        # Write SSH key with proper formatting
        printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
        chmod 400 ~/.ssh/ec2_key
        
        # Add host to known_hosts
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        
        # Debug: Check key file
        echo "Checking SSH key file..."
        ls -la ~/.ssh/ec2_key
        echo "First line:"
        head -1 ~/.ssh/ec2_key
        echo "Last line:"
        tail -1 ~/.ssh/ec2_key
        echo "Key file size:"
        wc -l ~/.ssh/ec2_key
        
        # Validate key format
        if ! ssh-keygen -l -f ~/.ssh/ec2_key >/dev/null 2>&1; then
          echo "ERROR: Invalid SSH key format"
          exit 1
        fi
        
        # Test SSH connection
        echo "Testing SSH connection..."
        ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PasswordAuthentication=no $EC2_USER@$EC2_HOST "echo 'SSH connection successful'"

    - name: Deploy to EC2
      run: |
        ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $EC2_USER@$EC2_HOST << EOF
          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            echo "Installing Docker..."
            sudo apt-get update
            sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            sudo usermod -aG docker $USER
            sudo systemctl start docker
            sudo systemctl enable docker
            echo "Docker installed successfully"
          else
            echo "Docker is already installed"
          fi
          
          # Install Docker Compose if not present
          if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
            echo "Installing Docker Compose..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            echo "Docker Compose installed successfully"
          else
            echo "Docker Compose is already installed"
          fi
          
          # Navigate to project directory
          cd /home/ubuntu/dating-popcorn-bot || {
            echo "Creating project directory..."
            mkdir -p /home/ubuntu/dating-popcorn-bot
            cd /home/ubuntu/dating-popcorn-bot
          }
          
          # Pull latest code
          if [ -d ".git" ]; then
            echo "Pulling latest changes..."
            git pull origin main
          else
            echo "Cloning repository..."
            # Clone using GitHub token for private repository access
            git clone https://${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git .
          fi
          
          # Check if docker-compose.yml exists
          if [ ! -f "docker-compose.yml" ]; then
            echo "ERROR: docker-compose.yml not found in $(pwd)"
            echo "Current directory contents:"
            ls -la
            echo "Looking for docker-compose.yml in parent directories..."
            find /home/ubuntu -name "docker-compose.yml" 2>/dev/null || echo "No docker-compose.yml found"
            exit 1
          fi
          
          # Stop existing containers
          echo "Stopping existing containers..."
          docker compose down || true
          
          # Remove old images to save space
          echo "Cleaning up old Docker images..."
          docker image prune -f || true
          
          # Build and start new containers
          echo "Building and starting new containers..."
          echo "Using docker-compose.yml from: $(pwd)"
          docker compose build --no-cache
          docker compose up -d
          
          # Show running containers
          echo "Current running containers:"
          docker ps
          
          # Show logs for verification
          echo "Bot logs (last 10 lines):"
          docker compose logs --tail=10
          
          echo "Deployment completed successfully!"
        EOF

    - name: Verify deployment
      run: |
        ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $EC2_USER@$EC2_HOST << EOF
          echo "Verifying bot is running..."
          sleep 10
          
          # Check current directory and files
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          
          # Check if docker-compose.yml exists
          if [ -f "docker-compose.yml" ]; then
            echo "✅ docker-compose.yml found"
          else
            echo "❌ docker-compose.yml not found"
            echo "Looking for it in parent directories..."
            find /home/ubuntu -name "docker-compose.yml" 2>/dev/null || echo "No docker-compose.yml found"
            exit 1
          fi
          
          # Check if container is running
          if docker ps | grep -q "dating-popcorn-bot"; then
            echo "✅ Bot container is running"
          else
            echo "❌ Bot container is not running"
            echo "All containers:"
            docker ps -a
            echo "Docker Compose status:"
            docker compose ps || echo "Docker Compose command failed"
            docker compose logs || echo "Could not get logs"
            exit 1
          fi
          
          # Check bot logs for any errors
          echo "Checking bot logs for errors..."
          if docker compose logs | grep -i "error\|exception\|failed"; then
            echo "❌ Found errors in bot logs"
            docker compose logs
            exit 1
          else
            echo "✅ No errors found in bot logs"
          fi
        EOF

    - name: Deployment success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "Bot is now running on EC2 instance: $EC2_HOST"
        echo "Check the logs with: ssh -i ~/.ssh/ec2_key $EC2_USER@$EC2_HOST 'docker compose logs -f'"
